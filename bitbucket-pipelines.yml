# ==============================================================================
# Bitbucket Pipelines - Fluxnote CI/CD para Azure
# ==============================================================================
# Deploy automatico para Azure App Service via Container Registry.
#
# Variaveis necessarias (Repo Settings > Pipelines > Repository Variables):
#   AZURE_ACR_NAME          - Nome do ACR (ex: fluxnoteacr)
#   AZURE_ACR_PASSWORD      - Password do ACR (secured)
#   AZURE_REGISTRY_URL      - URL do ACR (ex: fluxnoteacr.azurecr.io)
#   AZURE_APP_ID            - Service Principal appId
#   AZURE_PASSWORD          - Service Principal password (secured)
#   AZURE_TENANT_ID         - Service Principal tenant
#   AZURE_RESOURCE_GROUP    - Nome do Resource Group
#   AZURE_APP_NAME_BACKEND  - Nome do App Service backend
#   AZURE_APP_NAME_FRONTEND - Nome do App Service frontend
# ==============================================================================

image: atlassian/default-image:3

pipelines:
  branches:
    main:
      - parallel:
          # ---- Backend: Build & Deploy ----
          - step:
              name: Deploy Backend
              services:
                - docker
              caches:
                - docker
              script:
                - echo $AZURE_ACR_PASSWORD | docker login $AZURE_REGISTRY_URL -u $AZURE_ACR_NAME --password-stdin
                - docker build -t $AZURE_REGISTRY_URL/fluxnote-backend:latest -t $AZURE_REGISTRY_URL/fluxnote-backend:$BITBUCKET_COMMIT ./fluxnote-backend
                - docker push $AZURE_REGISTRY_URL/fluxnote-backend:latest
                - docker push $AZURE_REGISTRY_URL/fluxnote-backend:$BITBUCKET_COMMIT
                - pipe: microsoft/azure-web-apps-containers-deploy:1.0.3
                  variables:
                    AZURE_APP_ID: $AZURE_APP_ID
                    AZURE_PASSWORD: $AZURE_PASSWORD
                    AZURE_TENANT_ID: $AZURE_TENANT_ID
                    AZURE_RESOURCE_GROUP: $AZURE_RESOURCE_GROUP
                    AZURE_APP_NAME: $AZURE_APP_NAME_BACKEND
                    DOCKER_IMAGE_URL: '$AZURE_REGISTRY_URL/fluxnote-backend:latest'

          # ---- Frontend: Build & Deploy ----
          - step:
              name: Deploy Frontend
              services:
                - docker
              caches:
                - docker
              script:
                - echo $AZURE_ACR_PASSWORD | docker login $AZURE_REGISTRY_URL -u $AZURE_ACR_NAME --password-stdin
                - docker build -t $AZURE_REGISTRY_URL/fluxnote-frontend:latest -t $AZURE_REGISTRY_URL/fluxnote-frontend:$BITBUCKET_COMMIT -f ./fluxnote-frontend/Dockerfile.azure ./fluxnote-frontend
                - docker push $AZURE_REGISTRY_URL/fluxnote-frontend:latest
                - docker push $AZURE_REGISTRY_URL/fluxnote-frontend:$BITBUCKET_COMMIT
                - pipe: microsoft/azure-web-apps-containers-deploy:1.0.3
                  variables:
                    AZURE_APP_ID: $AZURE_APP_ID
                    AZURE_PASSWORD: $AZURE_PASSWORD
                    AZURE_TENANT_ID: $AZURE_TENANT_ID
                    AZURE_RESOURCE_GROUP: $AZURE_RESOURCE_GROUP
                    AZURE_APP_NAME: $AZURE_APP_NAME_FRONTEND
                    DOCKER_IMAGE_URL: '$AZURE_REGISTRY_URL/fluxnote-frontend:latest'
