# Map para Connection header condicional — essencial para WebSocket/SignalR
# - Se $http_upgrade tem valor (ex: "websocket") → Connection = "upgrade"
# - Se $http_upgrade está vazio (HTTP normal, ex: negotiate POST) → Connection = "keep-alive"
# SEM este map, nginx envia "Connection: Upgrade" em todos os pedidos (incluindo o
# negotiate POST do SignalR), o que o Azure App Service interpreta como malformado.
map $http_upgrade $connection_upgrade {
    default   upgrade;
    ''        keep-alive;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Handle Angular routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Azure backend App Service
    location /api/ {
        proxy_pass https://fluxnote-backend-app-hsepb9exgdfzb7gx.francecentral-01.azurewebsites.net/api/;
        proxy_http_version 1.1;

        # Connection condicional: "upgrade" só para WebSocket, "keep-alive" para HTTP normal
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Manter Host do backend (para Azure App Service aceitar request)
        proxy_set_header Host fluxnote-backend-app-hsepb9exgdfzb7gx.francecentral-01.azurewebsites.net;

        # Informar o backend qual é o domínio real do frontend (para gerar cookies corretas)
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # Headers para OAuth correlation cookie funcionarem
        proxy_set_header Origin https://$host;
        proxy_set_header Referer https://$host$request_uri;

        proxy_cache_bypass $http_upgrade;
        proxy_ssl_server_name on;

        # Timeouts para requests de longa duração
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    # Proxy SignalR Hub para colaboração em tempo real
    location /hubs/ {
        proxy_pass https://fluxnote-backend-app-hsepb9exgdfzb7gx.francecentral-01.azurewebsites.net/hubs/;
        proxy_http_version 1.1;

        # Connection condicional — CRÍTICO para SignalR:
        # - Upgrade request (WebSocket): Connection = "upgrade"
        # - HTTP normal (negotiate POST, Long Polling): Connection = "keep-alive"
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host fluxnote-backend-app-hsepb9exgdfzb7gx.francecentral-01.azurewebsites.net;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_cache_bypass $http_upgrade;
        proxy_ssl_server_name on;

        # Desativar buffering — NECESSÁRIO para SignalR Long Polling e Server-Sent Events.
        # Sem isto, o nginx acumula a resposta antes de enviar ao cliente,
        # quebrando o mecanismo de long-polling onde o servidor mantém a ligação aberta.
        proxy_buffering off;

        # Conexões WebSocket/Long Polling de longa duração
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }
}
