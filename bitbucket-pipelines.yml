image: atlassian/default-image:3

definitions:
  caches:
    npm: fluxnote-frontend/node_modules
    nuget: ~/.nuget/packages

  steps:
    # ── Backend: Restore + Build ──
    - step: &backend-build
        name: "Backend - Build"
        image: mcr.microsoft.com/dotnet/sdk:8.0
        caches:
          - nuget
        script:
          - dotnet restore fluxnote-backend/fluxnote-backend.csproj
          - dotnet build fluxnote-backend/fluxnote-backend.csproj -c Release --no-restore

    # ── Backend: Testes ──
    - step: &backend-test
        name: "Backend - Tests"
        image: mcr.microsoft.com/dotnet/sdk:8.0
        caches:
          - nuget
        script:
          - dotnet restore
          - dotnet test Fluxnote.Backend.Tests/Fluxnote.Backend.Tests.csproj
              --configuration Release
              --logger "console;verbosity=normal"
              --collect:"XPlat Code Coverage"
              --results-directory ./test-results
        artifacts:
          - test-results/**

    # ── Frontend: Install + Build ──
    - step: &frontend-build
        name: "Frontend - Build"
        image: node:20-alpine
        caches:
          - npm
        script:
          - cd fluxnote-frontend
          - npm ci
          - npx ng build --configuration production

    # ── Docker: Build imagens PROD ──
    - step: &docker-build
        name: "Docker - Build Images"
        services:
          - docker
        caches:
          - docker
        script:
          - docker compose -f docker-compose.prod.yml build

pipelines:
  pull-requests:
    "**":
      - parallel:
          - step: *backend-build
          - step: *frontend-build
      - step: *backend-test

  # ── Main (após merge) ──
  branches:
    main:
      - parallel:
          - step: *backend-build
          - step: *frontend-build
      - step: *backend-test
      - step: *docker-build
