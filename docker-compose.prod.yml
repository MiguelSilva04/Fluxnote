services:
  # SQL Server Database
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fluxnote-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=FluxNote@2024!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "FluxNote@2024!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # .NET Backend API
  backend:
    build:
      context: ./fluxnote-backend
      dockerfile: Dockerfile
    container_name: fluxnote-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__FluxnoteServerContext=Server=db;Database=FluxnoteDb;User Id=sa;Password=FluxNote@2024!;TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY}
    env_file:
      - .env
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy

  # Angular Frontend
  frontend:
    build:
      context: ./fluxnote-frontend
      dockerfile: Dockerfile
    container_name: fluxnote-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  sqlserver_data:
