# Development docker-compose
# Usage: docker compose up
services:
  # SQL Server Database
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fluxnote-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=FluxNote@2024!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "FluxNote@2024!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # .NET Backend API (Development with hot reload)
  backend:
    build:
      context: ./fluxnote-backend
      dockerfile: Dockerfile.dev
    container_name: fluxnote-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__FluxnoteServerContext=Server=db;Database=FluxnoteDb;User Id=sa;Password=FluxNote@2024!;TrustServerCertificate=True;
    ports:
      - "5000:5000"
    volumes:
      - ./fluxnote-backend:/app
      - /app/bin
      - /app/obj
    depends_on:
      db:
        condition: service_healthy

  # Angular Frontend (Development with hot reload)
  frontend:
    build:
      context: ./fluxnote-frontend
      dockerfile: Dockerfile.dev
    container_name: fluxnote-frontend
    ports:
      - "4200:4200"
    volumes:
      - ./fluxnote-frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  sqlserver_data:
