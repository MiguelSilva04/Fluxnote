server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Handle Angular routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Azure backend App Service
    location /api/ {
        proxy_pass https://fluxnote-backend-app-hsepb9exgdfzb7gx.francecentral-01.azurewebsites.net/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Manter Host do backend (para Azure App Service aceitar request)
        proxy_set_header Host fluxnote-backend-app-hsepb9exgdfzb7gx.francecentral-01.azurewebsites.net;

        # Informar o backend qual é o domínio real do frontend (para gerar cookies corretas)
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # Headers para OAuth correlation cookie funcionarem
        proxy_set_header Origin https://$host;
        proxy_set_header Referer https://$host$request_uri;

        proxy_cache_bypass $http_upgrade;
        proxy_ssl_server_name on;

        # Timeouts para WebSocket/SignalR (conexões longas de colaboração em tempo real)
        proxy_read_timeout 3600s;    # 1 hora
        proxy_send_timeout 3600s;    # 1 hora
        proxy_connect_timeout 60s;   # 1 minuto para estabelecer conexão
    }

    # Proxy SignalR Hub para colaboração em tempo real
    # WebSocket precisa de Upgrade + Connection headers explícitos
    location /hubs/ {
        proxy_pass https://fluxnote-backend-app-hsepb9exgdfzb7gx.francecentral-01.azurewebsites.net/hubs/;
        proxy_http_version 1.1;

        # Essencial para WebSocket handshake
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host fluxnote-backend-app-hsepb9exgdfzb7gx.francecentral-01.azurewebsites.net;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_cache_bypass $http_upgrade;
        proxy_ssl_server_name on;

        # Conexões WebSocket de longa duração (colaboração em tempo real)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }
}
