<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fluxnote</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Loading inicial antes do Angular carregar */
    .app-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f9fafb;
      z-index: 9999;
    }
    .app-loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e5e7eb;
      border-top-color: #155347;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .app-loading .logo {
      margin-bottom: 24px;
      font-size: 24px;
      font-weight: 700;
      color: #155347;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* Dark mode */
    html.dark .app-loading {
      background: #111827;
    }
    html.dark .app-loading .spinner {
      border-color: #374151;
      border-top-color: #34d399;
    }
  </style>
  <script>
    /* Apply saved theme before Angular loads to avoid flash */
    (function() {
      var theme = localStorage.getItem('fluxnote-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (theme === 'dark' || (theme === 'auto' && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body class="font-sans antialiased text-gray-900">
  <app-root>
    <!-- Loading que aparece enquanto o Angular carrega -->
    <div class="app-loading">
      <img src="assets/textIcon.png" alt="FluxNote" class="logo" width="240">
      <div class="spinner"></div>
    </div>
  </app-root>
</body>
</html>
